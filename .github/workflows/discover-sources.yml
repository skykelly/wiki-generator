name: Discover Sources

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 09:00 KST (00:00 UTC)
  workflow_dispatch:
    inputs:
      wiki_id:
        description: '특정 위키 ID (비우면 모든 위키 처리)'
        required: false
        default: ''
      score_threshold:
        description: '최소 관련도 점수 (0~10, 기본 6)'
        required: false
        default: '6'

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openai

      - name: Run discovery
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          WIKI_ID: ${{ github.event.inputs.wiki_id }}
          SCORE_THRESHOLD: ${{ github.event.inputs.score_threshold || '6' }}
        run: python3 scripts/discover_sources.py
